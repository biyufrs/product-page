<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <main>
      <header>
        <div class="balance-container">
          <h2>Balance</h2>
          <h3>
            Rp
            <p id="balance">200.000</p>
          </h3>
        </div>
        <div class="expenses-container">
          <h2>Expenses</h2>
          <h3>
            Rp
            <p id="expenses"></p>
          </h3>
        </div>
      </header>
      <form id="form">
        <div class="input">
          <input type="text" id="item" placeholder="Item" />
          <input type="text" id="price" placeholder="Price" />
          <div class="error-message-empty" id="emptyError">
            <p>
              <i class="bi bi-exclamation-triangle-fill"></i>
              Item or Price cant be empty!
            </p>
          </div>
          <div class="error-message-num" id="numError">
            <p>
              <i class="bi bi-exclamation-triangle-fill"></i>
              price must be number
            </p>
          </div>
          <div class="error-message-balance" id="balanceError">
            <p>
              <i class="bi bi-exclamation-triangle-fill"></i>
              not enough balance
            </p>
          </div>
        </div>
        <button type="submit">Add</button>
      </form>
      <section id="output">
        <h2>Expenses Detail</h2>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
